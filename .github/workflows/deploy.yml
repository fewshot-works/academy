name: Deploy Few-Shot Academy

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'email-worker/**'
      - 'labs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fewshot-academy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            site/package-lock.json
            email-worker/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Install email worker dependencies
        working-directory: email-worker
        run: npm ci

      - name: Build website
        working-directory: site
        run: npm run build

      - name: Apply D1 migrations
        working-directory: site
        run: npx wrangler d1 migrations apply DB --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy email worker and queue consumer
        working-directory: email-worker
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Build per-track labs zips
        run: |
          mkdir -p site/build/downloads
          for dir in labs/*/; do
            track=$(basename "$dir")
            git archive --format=zip --prefix="labs/$track/" -o "site/build/downloads/academy-labs-$track.zip" "HEAD:labs/$track"
          done

      - name: Deploy to Cloudflare Pages
        working-directory: site
        run: npx wrangler pages deploy build --project-name=fewshot-academy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
