name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'site/**'
      - 'labs/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build website
        working-directory: site
        run: npm run build

      - name: Build per-track labs zips
        run: |
          mkdir -p site/build/downloads
          for dir in labs/*/; do
            track=$(basename "$dir")
            git archive --format=zip --prefix="labs/$track/" -o "site/build/downloads/zero-to-agent-labs-$track.zip" "HEAD:labs/$track"
          done

      - uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
